[package]
name = "nostu_wavzz"
version = "3.0.0"
description = "Nostu Wavzz — Global Internet Radio"
authors = ["Nostu Wavzz"]
edition = "2021"

[lib]
name = "nostu_wavzz_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Vendored copy of tauri-plugin-media-session 0.2.4 (src-tauri/vendor/) that
# includes the Bluetooth/headphone auto-resume patch upstream has not merged.
# Building from the repo is fully reproducible — no patched cargo registry needed.
tauri-plugin-media-session = { path = "vendor/tauri-plugin-media-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
